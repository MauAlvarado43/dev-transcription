name: Validate and release

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Validate and package extension
        run: npm run package
      - name: Verify VSIX contents
        run: python3 scripts/verify-package.py
      - name: Upload validated package and release notes
        uses: actions/upload-artifact@v4
        with:
          name: dev-transcription
          path: |
            dist/dev-transcription-*.vsix
            dist/release-notes.md
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: dev-transcription-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download validated package and release notes
        uses: actions/download-artifact@v4
        with:
          name: dev-transcription
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          ASSET="dist/dev-transcription-${VERSION}.vsix"
          test -s "$ASSET"
          test -s dist/release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Bump package.json and CHANGELOG.md for a new release."
            exit 0
          fi

          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$GITHUB_SHA"
          fi

          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "Dev Transcription ${VERSION}" \
            --notes-file dist/release-notes.md
